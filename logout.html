<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Log Out - Zura Panel</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* --- CSS Variabel TEMA DEEP SPACE --- */
        :root {
            --bg-dark-blue: #020617;  /* Biru sangat gelap */
            --bg-deep-purple: #1e1b4b; /* Ungu gelap */
            --accent-purple: #8b5cf6;  /* Ungu terang untuk highlight */
            --accent-blue: #3b82f6;    /* Biru terang */
            --text-light: #f8fafc;     /* Putih terang */
            --text-muted: #94a3b8;     /* Abu kebiruan */
            
            /* Glassmorphism Gelap */
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(139, 92, 246, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --glow-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        body {
            background-color: var(--bg-dark-blue);
            /* Gradien radial dalam untuk kesan kedalaman luar angkasa */
            background-image: radial-gradient(ellipse at bottom, var(--bg-deep-purple) 0%, var(--bg-dark-blue) 100%);
            color: var(--text-light);
            display: flex; flex-direction: column; min-height: 100vh;
            padding-top: 100px; overflow-x: hidden; position: relative;
        }

        /* --- SPACE BACKGROUND EFFECTS (Stars & Planets) --- */
        .space-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        /* 1. Bintang Berkedip Cahaya Saja (Tanpa Maju Mundur) */
        .stars-twinkling {
            position: absolute; width: 2px; height: 2px; background: transparent;
            /* Menggunakan box-shadow untuk membuat banyak titik bintang */
            box-shadow: 10vw 15vh #fff, 30vw 45vh #fff, 80vw 10vh #fff, 
                        55vw 60vh #fff, 90vw 80vh #fff, 15vw 85vh #fff,
                        40vw 20vh #ddd, 70vw 30vh #ccc, 20vw 70vh #eee;
            /* Animasi kedip cahaya */
            animation: twinkle-light 4s infinite ease-in-out alternate;
        }
        .stars-twinkling::after {
            content: ''; position: absolute; top: 50vh; left: 30vw; width: 3px; height: 3px; background: transparent;
             box-shadow: 5vw 5vh #fff, 25vw 35vh #ccc, 75vw 5vh #fff, 
                        50vw 55vh #eee, 85vw 75vh #fff, 10vw 80vh #ddd;
             animation: twinkle-light 6s infinite ease-in-out alternate-reverse;
        }

        /* Keyframes baru: Hanya mengubah opacity, tidak ada scale/transform */
        @keyframes twinkle-light {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* 2. Planet-Planet CSS */
        .planet {
            position: absolute; border-radius: 50%;
            /* Animasi mengambang perlahan */
            animation: float-planet 10s ease-in-out infinite alternate;
        }

        /* Planet Ungu Besar (Kiri Atas) */
        .planet-1 {
            top: 15%; left: 10%; width: 120px; height: 120px;
            background: radial-gradient(circle at 30% 30%, var(--accent-purple), var(--bg-deep-purple) 60%, #000 100%); box-shadow: 0 0 30px rgba(139, 92, 246, 0.2); opacity: 0.8;
        }
        
        /* Planet Biru Sedang (Kanan Bawah) */
        .planet-2 {
            bottom: 20%; right: 15%; width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, var(--accent-blue), var(--bg-dark-blue) 60%, #000 100%); opacity: 0.6; animation-delay: -5s; animation-duration: 12s;
        }

        @keyframes float-planet {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-20px); }
        }


        /* --- UI COMPONENTS (DARK GLASS) --- */
        /* (Gaya Navbar, Sidebar, dan Card dipertahankan sama dengan tema sebelumnya agar konsisten) */
        .navbar {
            background: var(--glass-bg); width: 92%; max-width: 1200px; border-radius: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 25px; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            position: fixed; top: 25px; left: 0; right: 0; margin: 0 auto; z-index: 100;
            transition: transform 0.4s, opacity 0.4s;
        }
        .navbar.nav-hidden { transform: translateY(-150%); opacity: 0; pointer-events: none; }

        .nav-brand-left { display: flex; align-items: center; gap: 12px; }
        .nav-logo { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple); }
        .brand-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(to right, #fff, var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .hamburger { 
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--text-light); 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .hamburger:hover { color: #fff; background: var(--accent-purple); box-shadow: 0 0 20px var(--accent-purple); }

        /* --- SIDEBAR (DARK GLASS) --- */
        .sidebar { position: fixed; top: 0; left: -320px; width: 280px; height: 100vh; background: var(--glass-bg); border-right: 1px solid var(--glass-border); backdrop-filter: blur(15px); box-shadow: 10px 0 30px rgba(0,0,0,0.5); transition: left 0.4s; z-index: 1000; padding: 30px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: var(--accent-purple); }
        
        .sidebar-menu { display: flex; flex-direction: column; gap: 5px; }
        .menu-item { color: var(--text-muted); text-decoration: none; padding: 14px 16px; border-radius: 12px; display: flex; align-items: center; gap: 15px; transition: 0.3s; font-weight: 600; font-size: 0.95rem; position: relative; cursor: pointer; }
        .menu-item i { width: 24px; text-align: center; font-size: 1.1rem; }
        .menu-item:hover { color: var(--text-light); background: rgba(139, 92, 246, 0.1); }
        .menu-item.active { color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); border: 1px solid var(--glass-border); }
        .menu-item.active::before { content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; background-color: var(--accent-purple); border-radius: 50%; box-shadow: 0 0 10px var(--accent-purple); }

        .dropdown-btn { justify-content: space-between; }
        .dropdown-btn .fa-chevron-down { font-size: 0.8rem; transition: transform 0.3s; width: auto; }
        .dropdown-btn.open .fa-chevron-down { transform: rotate(180deg); color: var(--accent-purple); }
        .submenu { display: flex; flex-direction: column; gap: 5px; margin-left: 20px; border-left: 1px solid var(--glass-border); padding-left: 15px; margin-top: 5px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out; }
        .submenu.show { max-height: 200px; } 
        .submenu a { color: var(--text-muted); text-decoration: none; padding: 10px; border-radius: 8px; font-size: 0.9rem; transition: 0.3s; }
        .submenu a:hover { color: var(--accent-purple); background: rgba(139, 92, 246, 0.1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 6, 23, 0.7); opacity: 0; visibility: hidden; transition: 0.4s; z-index: 999; backdrop-filter: blur(3px); }
        .overlay.active { opacity: 1; visibility: visible; }

        /* --- MAIN CONTAINER --- */
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1; }

        /* --- LOGOUT CARD (SPACE EDITION) --- */
        .logout-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 40px; max-width: 450px; width: 100%;
            text-align: center; box-shadow: var(--glass-shadow), var(--glow-shadow);
            position: relative; overflow: hidden;
        }
        .logout-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(to right, transparent, var(--accent-purple), var(--accent-blue), transparent);
        }

        .icon-box {
            width: 90px; height: 90px;
            background: rgba(139, 92, 246, 0.1);
            border: 2px solid var(--accent-purple); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 25px auto; color: var(--accent-purple); font-size: 2.5rem;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
            /* Animasi icon tetap pulse */
            animation: pulse-space 3s infinite;
        }
        @keyframes pulse-space {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        h2 { font-size: 1.8rem; margin-bottom: 15px; color: var(--text-light); font-weight: 800; letter-spacing: 1px; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 30px; }
        p b { color: var(--accent-blue); }

        .btn-group { display: flex; gap: 15px; flex-direction: column; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 14px; border-radius: 12px;
            font-size: 1rem; font-weight: 700; text-decoration: none; 
            transition: all 0.3s; cursor: pointer; border: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(59, 130, 246, 0.6); filter: brightness(1.2); }

        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--glass-border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); color: var(--text-light); border-color: var(--accent-blue); }

        footer { background: var(--glass-bg); backdrop-filter: blur(15px); padding: 25px; text-align: center; border-top: 1px solid var(--glass-border); margin-top: auto; z-index: 1; }
        .footer-text { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 12px; }
        .footer-links a { color: var(--accent-blue); text-decoration: none; font-size: 0.9rem; margin: 0 5px; transition: 0.3s;}
        .footer-links a:hover { color: var(--accent-purple); }
        .footer-links span { color: var(--glass-border); }

        @media (min-width: 480px) { .btn-group { flex-direction: row; } }
    </style>
</head>
<body>

    <div class="space-container">
        <div class="stars-twinkling"></div>
        <div class="planet planet-1"></div>
        <div class="planet planet-2"></div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="nav-brand-left">
            <img src="../assets/logo.png" alt="Zura Logo" class="nav-logo" onerror="this.src='https://zura14.web.id/mptourl/zuralogo_1761593400.jpg'">
            <span class="brand-title">Zura Panel</span>
        </div>
        <button class="hamburger" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="sidebar-menu">
            <a href="dashboardz" class="menu-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="GetNum" class="menu-item">
                <i class="fas fa-mobile-screen-button"></i> Get Number
            </a>
            <a href="dashboardz/consol" class="menu-item">
                <i class="fas fa-terminal"></i> Consol
            </a>

            <div class="menu-item dropdown-btn open" onclick="toggleDropdown()">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <i class="fas fa-grip"></i> Other
                </div>
                <i class="fas fa-chevron-down" id="dropIcon"></i>
            </div>
            
            <div class="submenu show" id="otherMenu">
                <a href="dashboardz/profil"><i class="fas fa-user-circle" style="width: 20px;"></i> Profil</a>
                <a href="#"><i class="fas fa-wallet" style="width: 20px;"></i> Payment</a>
                <a href="logout.php" class="menu-item active" style="padding: 12px; margin-top: 5px; color: var(--accent-purple);">
                    <i class="fas fa-sign-out-alt" style="width: 20px;"></i> Log out
                </a>
            </div>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-container">
        <div class="logout-card">
            <div class="icon-box">
                <i class="fas fa-rocket"></i>
            </div>
            <h2>Akhiri Misi?</h2>
            <p>
                Anda akan keluar dari Zura Panel. Sesi aktif saat ini akan dihentikan. 
                <br><br>
                <b>Ketik ulang kredensial</b> untuk kembali ke pangkalan.
            </p>
            
            <div class="btn-group">
                <a href="javascript:history.back()" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Batal
                </a>
                <a href="?action=confirm" class="btn btn-danger">
                    <i class="fas fa-power-off"></i> Ya, Log Out
                </a>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-text">
            &copy; 2026 ZuraStore - All rights reserved.
        </div>
        <div class="footer-links">
            <a href="#">Support</a><span>|</span>
            <a href="#">Contact</a><span>|</span>
            <a href="#">FAQ</a>
        </div>
    </footer>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function toggleDropdown() {
            const submenu = document.getElementById('otherMenu');
            const dropBtn = document.querySelector('.dropdown-btn');
            submenu.classList.toggle('show');
            dropBtn.classList.toggle('open');
        }

        // Navbar animasi scroll hilang timbul
        let lastScrollTop = 0;
        window.addEventListener("scroll", function() {
            let navbar = document.getElementById("navbar");
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                navbar.classList.add("nav-hidden");
            } else {
                navbar.classList.remove("nav-hidden");
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        }, false);
    </script>
</body>
</html>
