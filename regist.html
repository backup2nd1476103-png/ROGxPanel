<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register - Zura Panel</title>

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
>

<style>

:root {
    --bg-dark-blue: #020617;
    --bg-deep-purple: #1e1b4b;
    --accent-purple: #8b5cf6;
    --accent-blue: #3b82f6;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;

    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(139, 92, 246, 0.3);
    --glass-shadow:
        0 8px 32px rgba(0, 0, 0, 0.5);

    --glow-shadow:
        0 0 20px rgba(139, 92, 246, 0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
    background-color: var(--bg-dark-blue);

    background-image:
        radial-gradient(
            ellipse at bottom,
            var(--bg-deep-purple) 0%,
            var(--bg-dark-blue) 100%
        );

    color: var(--text-light);

    display: flex;
    flex-direction: column;

    min-height: 100vh;

    padding-top: 100px;

    overflow-x: hidden;

    position: relative;
}

/* ============================================================
   BACKGROUND
============================================================ */

.space-container {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: -1;

    overflow: hidden;
}

.stars-twinkling {
    position: absolute;

    width: 2px;
    height: 2px;

    background: transparent;

    box-shadow:
        10vw 15vh #fff,
        30vw 45vh #fff,
        80vw 10vh #fff,
        55vw 60vh #fff,
        90vw 80vh #fff,
        15vw 85vh #fff,
        40vw 20vh #ddd,
        70vw 30vh #ccc,
        20vw 70vh #eee;

    animation:
        twinkle-light
        4s
        infinite
        ease-in-out
        alternate;
}

.stars-twinkling::after {
    content: '';

    position: absolute;

    top: 50vh;
    left: 30vw;

    width: 3px;
    height: 3px;

    background: transparent;

    box-shadow:
        5vw 5vh #fff,
        25vw 35vh #ccc,
        75vw 5vh #fff,
        50vw 55vh #eee,
        85vw 75vh #fff,
        10vw 80vh #ddd;

    animation:
        twinkle-light
        6s
        infinite
        ease-in-out
        alternate-reverse;
}

@keyframes twinkle-light {

    0% {
        opacity: 0.2;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.4;
    }
}

.planet {
    position: absolute;

    border-radius: 50%;

    animation:
        float-planet
        10s
        ease-in-out
        infinite
        alternate;
}

.planet-1 {

    top: 15%;
    left: 10%;

    width: 120px;
    height: 120px;

    background:
        radial-gradient(
            circle at 30% 30%,
            var(--accent-purple),
            var(--bg-deep-purple) 60%,
            #000 100%
        );

    box-shadow:
        0 0 30px rgba(139, 92, 246, 0.2);

    opacity: 0.8;
}

.planet-2 {

    bottom: 20%;
    right: 15%;

    width: 80px;
    height: 80px;

    background:
        radial-gradient(
            circle at 30% 30%,
            var(--accent-blue),
            var(--bg-dark-blue) 60%,
            #000 100%
        );

    opacity: 0.6;

    animation-delay: -5s;
    animation-duration: 12s;
}

@keyframes float-planet {

    0% {
        transform: translateY(0);
    }

    100% {
        transform: translateY(-20px);
    }
}

/* ============================================================
   NAVBAR
============================================================ */

.navbar {

    background: var(--glass-bg);

    width: 92%;
    max-width: 1200px;

    border-radius: 50px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 25px;

    box-shadow: var(--glass-shadow);

    border:
        1px solid
        var(--glass-border);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    position: fixed;

    top: 25px;

    left: 0;
    right: 0;

    margin: 0 auto;

    z-index: 100;

    transition:
        transform 0.4s,
        opacity 0.4s;
}

.navbar.nav-hidden {

    transform:
        translateY(-150%);

    opacity: 0;

    pointer-events: none;
}

.nav-brand-left {

    display: flex;
    align-items: center;

    gap: 12px;
}

.nav-logo {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    object-fit: cover;

    border:
        2px solid
        var(--accent-purple);

    box-shadow:
        0 0 15px
        var(--accent-purple);
}

.brand-title {

    font-size: 1.3rem;

    font-weight: 700;

    background:
        linear-gradient(
            to right,
            #fff,
            var(--accent-blue)
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}

.hamburger {

    background:
        rgba(255,255,255,0.1);

    border:
        1px solid
        var(--glass-border);

    color: var(--text-light);

    font-size: 1.2rem;

    cursor: pointer;

    transition: 0.3s;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.hamburger:hover {

    color: #fff;

    background:
        var(--accent-purple);

    box-shadow:
        0 0 20px
        var(--accent-purple);

    transform:
        scale(1.1);
}

/* ============================================================
   SIDEBAR
============================================================ */

.sidebar {

    position: fixed;

    top: 0;
    left: -320px;

    width: 280px;
    height: 100vh;

    background:
        var(--glass-bg);

    border-right:
        1px solid
        var(--glass-border);

    backdrop-filter:
        blur(15px);

    box-shadow:
        10px 0 30px
        rgba(0,0,0,0.5);

    transition:
        left 0.4s;

    z-index: 1000;

    padding: 30px 20px;

    display: flex;
    flex-direction: column;

    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

.sidebar-header {

    display: flex;

    justify-content: flex-end;

    margin-bottom: 40px;
}

.close-btn {

    background: none;

    border: none;

    color: var(--text-muted);

    font-size: 1.5rem;

    cursor: pointer;
}

.close-btn:hover {

    color:
        var(--accent-purple);
}

.sidebar-menu a {

    color:
        var(--text-muted);

    text-decoration: none;

    padding: 16px;

    border-radius: 12px;

    margin-bottom: 8px;

    display: flex;

    align-items: center;

    gap: 15px;

    transition: 0.3s;

    font-weight: 600;
}

.sidebar-menu a i {

    width: 24px;

    text-align: center;
}

.sidebar-menu a:hover {

    background:
        rgba(139, 92, 246, 0.1);

    color:
        var(--text-light);
}

.overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    background:
        rgba(2, 6, 23, 0.7);

    opacity: 0;

    visibility: hidden;

    transition: 0.4s;

    z-index: 999;

    backdrop-filter:
        blur(3px);
}

.overlay.active {

    opacity: 1;

    visibility: visible;
}

/* ============================================================
   MAIN
============================================================ */

main {

    flex: 1;

    display: flex;

    justify-content: center;

    align-items: center;

    padding:
        20px
        20px
        100px
        20px;

    z-index: 1;
}

.login-card {

    background:
        var(--glass-bg);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid
        var(--glass-border);

    padding:
        45px 40px;

    border-radius: 24px;

    width: 100%;

    max-width: 450px;

    display: grid;

    gap: 20px;

    box-shadow:
        var(--glass-shadow),
        var(--glow-shadow);

    position: relative;

    overflow: hidden;
}

.login-card::before {

    content: '';

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 3px;

    background:
        linear-gradient(
            to right,
            transparent,
            var(--accent-purple),
            var(--accent-blue),
            transparent
        );
}

.login-header {

    text-align: center;

    z-index: 1;
}

.login-header h2 {

    font-size: 2rem;

    margin-bottom: 5px;

    font-weight: 800;

    letter-spacing: 1px;
}

.login-header p {

    color:
        var(--text-muted);

    font-size: 0.95rem;
}

.form-grid {

    display: grid;

    gap: 15px;

    z-index: 1;
}

.input-group {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.input-group label {

    font-size: 0.85rem;

    font-weight: 600;

    color:
        var(--text-muted);

    margin-left: 5px;
}

.input-wrapper {

    position: relative;

    width: 100%;
}

.input-wrapper i {

    position: absolute;

    left: 15px;

    top: 50%;

    transform:
        translateY(-50%);

    color:
        var(--text-muted);
}

.input-group input {

    width: 100%;

    padding:
        12px
        15px
        12px
        45px;

    border-radius: 12px;

    border:
        1px solid
        var(--glass-border);

    background:
        rgba(0, 0, 0, 0.4);

    color:
        var(--text-light);

    outline: none;

    transition: 0.3s;

    font-size: 0.95rem;
}

.input-group input:focus {

    border-color:
        var(--accent-blue);

    box-shadow:
        0 0 15px
        rgba(59,130,246,0.4);

    background:
        rgba(0,0,0,0.6);
}

/* ============================================================
   BUTTON
============================================================ */

.btn-login {

    background:
        linear-gradient(
            135deg,
            var(--accent-purple),
            var(--accent-blue)
        );

    color: white;

    border: none;

    padding: 14px;

    border-radius: 12px;

    font-size: 1.05rem;

    font-weight: 700;

    cursor: pointer;

    transition: 0.3s;

    margin-top: 10px;

    box-shadow:
        0 0 20px
        rgba(139,92,246,0.4);
}

.btn-login:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 0 30px
        rgba(59,130,246,0.6);

    filter:
        brightness(1.2);
}

/* ============================================================
   ALERT
============================================================ */

.alert {

    padding: 15px;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

    margin-bottom: 10px;

    z-index: 1;

    font-size: 0.9rem;
}

.alert.success {

    background:
        rgba(34,197,94,0.15);

    color:
        #4ade80;

    border:
        1px solid
        rgba(34,197,94,0.3);
}

.alert.error {

    background:
        rgba(239,68,68,0.15);

    color:
        #f87171;

    border:
        1px solid
        rgba(239,68,68,0.3);
}

/* ============================================================
   LOGIN LINK
============================================================ */

.register-link {

    text-align: center;

    font-size: 0.9rem;

    color:
        var(--text-muted);

    z-index: 1;
}

.register-link a {

    color:
        var(--accent-blue);

    text-decoration: none;

    font-weight: 700;
}

.register-link a:hover {

    color:
        var(--accent-purple);

    text-decoration: underline;
}

/* ============================================================
   FOOTER
============================================================ */

footer {

    background:
        var(--glass-bg);

    backdrop-filter:
        blur(15px);

    padding: 25px;

    text-align: center;

    border-top:
        1px solid
        var(--glass-border);

    margin-top: auto;

    z-index: 1;
}

.footer-text {

    color:
        var(--text-muted);

    font-size: 0.9rem;

    margin-bottom: 12px;
}

.footer-links a {

    color:
        var(--accent-blue);

    text-decoration: none;

    font-size: 0.9rem;

    margin: 0 5px;
}

.footer-links span {

    color:
        var(--glass-border);
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 500px) {

    .login-card {

        padding:
            35px 20px;

    }

    .navbar {

        width: 94%;

        padding:
            8px 15px;
    }

    .brand-title {

        font-size: 1.1rem;
    }
}

</style>

</head>

<body>

<!-- ============================================================
     BACKGROUND
============================================================ -->

<div class="space-container">

    <div class="stars-twinkling"></div>

    <div class="planet planet-1"></div>

    <div class="planet planet-2"></div>

</div>

<!-- ============================================================
     NAVBAR
============================================================ -->

<nav class="navbar" id="navbar">

    <div class="nav-brand-left">

        <img
            src="https://x.zurastore.my.id/assets/logo.png"
            alt="Zura Logo"
            class="nav-logo"
        >

        <span class="brand-title">
            Zura Panel
        </span>

    </div>

    <button
        class="hamburger"
        onclick="toggleSidebar()"
    >
        <i class="fas fa-bars"></i>
    </button>

</nav>

<!-- ============================================================
     SIDEBAR
============================================================ -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <button
            class="close-btn"
            onclick="toggleSidebar()"
        >
            <i class="fas fa-times"></i>
        </button>

    </div>

    <div class="sidebar-menu">

        <a href="../">
            <i class="fas fa-sign-in-alt"></i>
            Login
        </a>

        <a href="https://zurastore.xyz">
            <i class="fas fa-box"></i>
            Produk
        </a>

        <a href="#">
            <i class="fas fa-headset"></i>
            Bantuan
        </a>

    </div>

</div>

<div
    class="overlay"
    id="overlay"
    onclick="toggleSidebar()"
></div>

<!-- ============================================================
     MAIN
============================================================ -->

<main>

    <div class="login-card">

        <div class="login-header">

            <h2>
                Buat Akun
            </h2>

            <p>
                Daftar untuk mengakses stasiun panel
            </p>

        </div>

        
        <form
            action=""
            method="POST"
            class="form-grid"
        >

            <input
                type="hidden"
                name="submit_register"
                value="1"
            >

            <!-- FULL NAME -->

            <div class="input-group">

                <label>
                    Full Name
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-user"></i>

                    <input
                        type="text"
                        name="fullname"
                        placeholder="Masukkan nama lengkap"
                        required
                    >

                </div>

            </div>

            <!-- EMAIL -->

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        placeholder="nama@gmail.com"
                        pattern=".*@gmail\.com$"
                        required
                    >

                </div>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Buat password"
                        required
                    >

                </div>

            </div>

            <!-- TELEGRAM -->

            <div class="input-group">

                <label>
                    Username Telegram
                </label>

                <div class="input-wrapper">

                    <i class="fab fa-telegram"></i>

                    <input
                        type="text"
                        name="telegram"
                        placeholder="@username"
                        required
                    >

                </div>

            </div>

            <!-- REFERRAL -->

            <div class="input-group">

                <label>
                    Referral Code (Opsional)
                </label>

                <div class="input-wrapper">

                    <i class="fas fa-ticket-alt"></i>

                    <input
                        type="text"
                        name="referral"
                        placeholder="Kosongkan jika tidak ada"
                    >

                </div>

            </div>

            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn-login"
            >

                <i class="fas fa-user-plus"></i>
                Buat Akun

            </button>

        </form>

        <div class="register-link">

            Sudah punya akun?

            <a href="../">
                Login di sini
            </a>

        </div>

    </div>

</main>

<!-- ============================================================
     FOOTER
============================================================ -->

<footer>

    <div class="footer-text">

        &copy; 2026 ZuraStore -
        All rights reserved.

    </div>

    <div class="footer-links">

        <a href="#">
            Support
        </a>

        <span>|</span>

        <a href="#">
            Contact
        </a>

        <span>|</span>

        <a href="#">
            FAQ
        </a>

    </div>

</footer>

<!-- ============================================================
     JAVASCRIPT
============================================================ -->

<script>

function toggleSidebar() {

    document
        .getElementById('sidebar')
        .classList
        .toggle('open');

    document
        .getElementById('overlay')
        .classList
        .toggle('active');
}


// Navbar hide saat scroll

let lastScrollTop = 0;

window.addEventListener(
    "scroll",
    function () {

        const navbar =
            document.getElementById("navbar");

        const scrollTop =
            window.pageYOffset ||
            document.documentElement.scrollTop;

        if (
            scrollTop > lastScrollTop &&
            scrollTop > 50
        ) {

            navbar.classList.add(
                "nav-hidden"
            );

        } else {

            navbar.classList.remove(
                "nav-hidden"
            );
        }

        lastScrollTop =
            scrollTop <= 0
                ? 0
                : scrollTop;

    },
    false
);

</script>

</body>

</html>
